name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle (wrapper & cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk meshroute.apk

      - name: Publish / Update Stable 'latest' Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "MeshRoute (latest)"
          body: "Official MeshRoute Android APK automatically built from the latest commit on `main`."
          allowUpdates: true
          removeArtifacts: true
          artifacts: meshroute.apk
          token: ${{ secrets.GITHUB_TOKEN }}
